<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Planner & Analytics | Master Suite</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
        },
        colors: {
          brandNavy: '#07152b',
          cardNavy: '#092244',
          sidebarNavy: '#07152b',
          accentYellow: '#facc15',
          cSchool: '#2563eb',
          cTuition: '#f97316',
          cStudy: '#8b5cf6',
          cSuccess: '#10b981',
          cDanger: '#ef4444',
        }
      }
    }
  }
</script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>

<!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>

<style>
body { -webkit-tap-highlight-color: transparent; }
.tab-content { display: none; opacity: 0; transition: opacity .2s ease-in-out; }
.tab-content.active { display: block; opacity: 1; }

.cat-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  border-radius: 6px;
  padding: 3px 8px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 10px;
  white-space: nowrap;
}
.cat-pill.School { background-color: #2563eb; color: #ffffff; }
.cat-pill.Tuition { background-color: #f97316; color: #ffffff; }
.cat-pill.Study { background-color: #8b5cf6; color: #ffffff; }

@keyframes liveDot {
  0% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.3; transform: scale(1.25); }
  100% { opacity: 1; transform: scale(1); }
}
.live-pulse { animation: liveDot 1.4s infinite ease-in-out; }

.nav-btn {
  transition: all 0.15s ease-in-out;
  border-left: 3px solid transparent;
}
.nav-btn.active {
  background-color: rgba(254, 240, 138, 0.16) !important;
  color: #fef08a !important;
  font-weight: 800 !important;
  border-left-color: #facc15 !important;
  padding-left: 10px !important;
}

@media screen and (max-width: 640px) {
  .mobile-table thead { display: none !important; }
  .mobile-table, .mobile-table tbody {
    display: flex !important;
    flex-direction: column !important;
    width: 100% !important;
    gap: 8px !important;
    padding: 2px !important;
  }
  .mobile-table tr {
    display: grid !important;
    grid-template-columns: 36px 1fr auto !important;
    grid-template-areas:
      "cb tk hr"
      "cb tm cat" !important;
    gap: 6px 8px !important;
    align-items: center !important;
    background: #ffffff !important;
    border: 1px solid #e2e8f0 !important;
    border-radius: 12px !important;
    padding: 10px !important;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03) !important;
  }
  .mobile-table tr.empty-row { display: block !important; padding: 16px !important; text-align: center !important; }
  .mobile-table td { display: flex !important; align-items: center !important; border: none !important; padding: 0 !important; }
  .col-cb { grid-area: cb !important; }
  .col-tm { grid-area: tm !important; width: 100% !important; justify-content: flex-start !important; font-size: 11px !important; }
  .col-tk { grid-area: tk !important; width: 100% !important; font-size: 13.5px !important; }
  .col-cat { grid-area: cat !important; justify-content: flex-end !important; }
  .col-hr { grid-area: hr !important; justify-content: flex-end !important; }
}

@media print {
  @page { size: A4 portrait; margin: 6mm; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body { background: #ffffff !important; padding: 0 !important; font-size: 10px !important; }
  .print-hide { display: none !important; }
}
</style>
</head>
<body class="bg-[#f0f4f9] text-slate-800 p-2 sm:p-3 min-h-screen">

<!-- Global Toast Container -->
<div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

<!-- Generic Confirm / Prompt Modal -->
<div id="actionModal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-3 hidden" role="dialog" aria-modal="true">
  <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl border border-slate-200 overflow-hidden p-4 space-y-3">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center font-black">
        <i data-lucide="help-circle" class="w-5 h-5"></i>
      </div>
      <h3 id="actionModalTitle" class="text-sm font-bold text-slate-900">Confirmation</h3>
    </div>
    <p id="actionModalMsg" class="text-xs text-slate-600 leading-relaxed"></p>
    <div id="actionModalInputContainer" class="hidden">
      <input type="text" id="actionModalInput" class="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-xs font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
      <button id="actionModalCancelBtn" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-lg transition min-h-[36px]">Cancel</button>
      <button id="actionModalConfirmBtn" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-lg transition min-h-[36px]">Confirm</button>
    </div>
  </div>
</div>

<!-- Attendance & WhatsApp Modal -->
<div id="attendanceModal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-3 hidden" role="dialog" aria-modal="true">
  <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col max-h-[92vh]">
    <div class="p-3.5 sm:p-4 bg-brandNavy text-white flex items-center justify-between border-b border-slate-800">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0">
          <i data-lucide="check-square" class="w-4 h-4"></i>
        </div>
        <div class="min-w-0">
          <h3 id="attBatchTitle" class="text-sm font-extrabold text-white leading-tight truncate">Mark Attendance</h3>
          <p id="attBatchSubtitle" class="text-[11px] text-slate-300 font-medium">Verify attendance before launching WhatsApp reminder</p>
        </div>
      </div>
      <button onclick="closeAttendanceModal()" class="text-slate-400 hover:text-white p-2 rounded-lg transition min-h-[36px] min-w-[36px] flex items-center justify-center">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="px-4 py-2 bg-slate-100 border-b border-slate-200 flex items-center justify-between gap-2">
      <span class="text-xs font-bold text-slate-700">Attendance For:</span>
      <div class="flex items-center gap-1.5" id="attDateButtonsGroup">
        <button type="button" id="btnDatePrevious" onclick="switchAttDate('previous')" class="px-3 py-1.5 text-xs font-bold rounded-lg border transition min-h-[36px]">Previous Class</button>
        <button type="button" id="btnDateToday" onclick="switchAttDate('today')" class="px-3 py-1.5 text-xs font-bold rounded-lg border transition min-h-[36px]">Class Date</button>
      </div>
    </div>

    <div id="attPrevWarningBanner" class="px-4 py-2 bg-amber-50 border-b border-amber-200 text-amber-800 text-xs font-semibold flex items-center gap-2 hidden">
      <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600 shrink-0"></i>
      <span>Previous class attendance was never recorded. Mark it now or continue.</span>
    </div>

    <div class="px-4 py-2 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-1.5">
        <button onclick="markAllAttendance('P')" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-300 font-bold rounded-lg text-xs flex items-center gap-1 transition active:scale-95 min-h-[36px]">
          <i data-lucide="check-check" class="w-3.5 h-3.5"></i> All Present
        </button>
        <button onclick="markAllAttendance('A')" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-300 font-bold rounded-lg text-xs flex items-center gap-1 transition active:scale-95 min-h-[36px]">
          <i data-lucide="x" class="w-3.5 h-3.5"></i> All Absent
        </button>
      </div>
      <div id="attStatsCounter" class="text-xs font-black text-slate-700 bg-white px-2.5 py-1 rounded-lg border border-slate-200">
        0 Present / 0 Total
      </div>
    </div>

    <div class="p-3 sm:p-4 overflow-y-auto space-y-2 flex-1" id="attStudentList"></div>

    <div class="p-2.5 bg-slate-50 border-t border-slate-200 flex items-center gap-2">
      <div class="relative flex-1">
        <i data-lucide="user-plus" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="newStudentInput" placeholder="Add student name to batch roster..." class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white min-h-[38px]" onkeydown="if(event.key==='Enter') addStudentFromModal()">
      </div>
      <button onclick="addStudentFromModal()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-lg transition active:scale-95 shrink-0 min-h-[38px]">Add</button>
    </div>

    <div class="px-4 py-2 bg-slate-100 border-t border-slate-200 flex items-center justify-between">
      <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer select-none">
        <input type="checkbox" id="includeAbsenteeToggle" checked class="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
        <span>Include absentee list in WhatsApp reminder</span>
      </label>
    </div>

    <div class="p-3 bg-white border-t border-slate-200 flex items-center justify-between gap-2">
      <button onclick="saveAttendanceOnly()" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition min-h-[40px]">Save Attendance Only</button>
      <button onclick="confirmAttendanceAndLaunchWhatsApp()" class="flex-1 py-2 px-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs rounded-xl flex items-center justify-center gap-1.5 shadow-sm transition active:scale-95 min-h-[40px]">
        <svg class="w-4 h-4 fill-white shrink-0" viewBox="0 0 24 24">
          <path d="M17.472 14.382c-.301-.15-1.781-.879-2.056-.98-.
